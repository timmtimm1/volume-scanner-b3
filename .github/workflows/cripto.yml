name: cripto

# O pipeline diario das criptomoedas (aba Cripto): carga dos candles da
# Binance, z-score de volume, setups, niveis e resumo no Telegram. E o mesmo
# `scanner daily` do pregao, com SCANNER_MERCADO=cripto, gravando no schema
# `cripto_scanner` do mesmo banco (ver src/scanner/mercado.py).
#
# Disparado pelo cron externo (cron-job.org) via workflow_dispatch, como todos
# os outros: o agendador nativo do GitHub entregou 11% dos horarios neste
# repositorio (ver .github/cron-externo.yml, que tem a agenda). Sao dois
# disparos por dia, todos os dias: 21:10 de Brasilia, dez minutos depois de o
# candle diario fechar (meia-noite UTC), e 00:10 como reserva.
#
# Os dois disparos sao identicos e pedem `--so-se-faltar`: o primeiro processa
# o dia e manda o resumo; o segundo ve o resumo carimbado e sai sem fazer nada.
# Para reprocessar um dia de proposito, rode a mao com `refazer` marcado.
#
# Nao dispara rebuild na Vercel: as paginas de cripto sao lidas do banco a cada
# visita (so para quem esta logado), entao o dado novo aparece sozinho.
on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Dia do candle: 'ultimo' (o mais recente ja fechado) ou AAAA-MM-DD"
        required: false
        default: "ultimo"
      refazer:
        description: "Reprocessar mesmo que o resumo deste dia ja tenha saido"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cripto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mesmo grupo do pregao: os dois aplicam migrations no mesmo banco, e duas
    # ao mesmo tempo brigariam pela tabela de versao.
    concurrency:
      group: pregao
      cancel-in-progress: false
    env:
      SCANNER_MERCADO: cripto
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
      SCANNER_WEB_BASE_URL: ${{ vars.SCANNER_WEB_BASE_URL }}
      DIA: ${{ inputs.trade_date || 'ultimo' }}
      # Nao e `inputs.refazer && '' || '--so-se-faltar'`: no Actions o texto
      # vazio e falso, e a expressao caia sempre no --so-se-faltar (o botao
      # refazer nao fazia nada, visto em 17/11/2026). Negando antes, o lado
      # verdadeiro e o texto nao vazio.
      SO_SE_FALTAR: ${{ !inputs.refazer && '--so-se-faltar' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        id: deps
        run: uv sync --locked --no-dev

      - name: Conferir os segredos
        run: test -n "$SCANNER_DATABASE_URL" || { echo "::error::SCANNER_DATABASE_URL ausente"; exit 1; }

      - name: Migrations (schema de cripto)
        id: migrations
        # Na primeira execucao cria o schema `cripto_scanner` e todas as tabelas.
        run: uv run --no-sync alembic upgrade head

      - name: Candle do dia
        id: diario
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync scanner daily --date "$DIA" $SO_SE_FALTAR 2>&1 | tee /tmp/cripto.log

      - name: Avisar no Telegram se algo falhou
        if: ${{ failure() && env.SCANNER_TELEGRAM_BOT_TOKEN != '' && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          RES_DEPS: ${{ steps.deps.outcome }}
          RES_MIGRATIONS: ${{ steps.migrations.outcome }}
        run: |
          onde="carga ou calculo do dia"
          if [ "$RES_DEPS" = failure ]; then
            onde="instalacao das dependencias"
          elif [ "$RES_MIGRATIONS" = failure ]; then
            onde="migrations"
          else
            ultima=$(grep -E '^\[[0-9]/8\]' /tmp/cripto.log 2>/dev/null | tail -1 | cut -c1-60 || true)
            if [ -n "$ultima" ]; then onde="depois de $ultima"; fi
          fi
          onde=$(printf '%s' "$onde" | tr -d '<>&' | iconv -c -f UTF-8 -t UTF-8 2>/dev/null || true)
          texto=$(printf '⚠️ <b>A carga de cripto falhou</b>\nOnde: %s\nO pregão das ações não depende disto.\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$onde" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"
