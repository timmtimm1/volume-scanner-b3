name: rompimentos

# Disparado por um cron externo (cron-job.org) via workflow_dispatch, nao pelo
# agendador nativo do GitHub -- que em repo publico gratuito atrasa e falha
# demais para ser confiavel.
#
# Agenda no cron externo: de 15 em 15 minutos durante o pregao, 10:00 as 18:59
# BRT, de segunda a sexta (cron "7,22,37,52 10-18 * * 1-5", fuso America/Sao_Paulo).
#
# Vai ate as 18:xx e nao ate as 17:xx de proposito: o pregao fecha as 18:00 e o
# leilao de fechamento se estende alguns minutos. Parar as 17:52 perderia
# justamente o rompimento que acontece no fechamento. As passadas depois do
# leilao so reconfirmam um preco que nao muda mais -- gastam requisicao, nao
# geram alarme falso.
#
# Fora do pregao nao roda: alerta de rompimento so faz sentido com o mercado
# aberto, e checar de madrugada gastaria requisicao dos fornecedores a toa.
#
# O minuto 7 evita a fila dos que agendam em ponto.
on:
  workflow_dispatch:

# Mesmo padrao aplicado ao daily.yml: o token do job so precisa ler o
# repositorio para o checkout. Sem escopo de escrita mesmo por padrao.
permissions:
  contents: read

concurrency:
  # Duas passadas sobrepostas poderiam avisar duas vezes o mesmo alerta. O
  # `marcar_disparado` ja protege disso no banco (so marca se ainda estiver
  # ativo), mas evitar a corrida e mais barato do que depender da trava.
  group: rompimentos
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
      SCANNER_WEB_BASE_URL: ${{ vars.SCANNER_WEB_BASE_URL }}
      # Opcional: sem token a brapi fica de fora e so o Yahoo responde. Com
      # ele, os dois sao consultados e vale a cotacao de hora mais nova.
      SCANNER_BRAPI_TOKEN: ${{ secrets.SCANNER_BRAPI_TOKEN }}
      # Papeis por requisicao na brapi. Padrao 1, o do plano gratuito; 10 no
      # Startup, 20 no Pro. Nao e segredo.
      SCANNER_BRAPI_LOTE: ${{ vars.SCANNER_BRAPI_LOTE || '1' }}

    steps:
      - uses: actions/checkout@v5

      # O cron externo dispara de segunda a sexta, e feriado da B3 cai em dia
      # util. Sem esta guarda, cada feriado instalaria as dependencias e abriria
      # conexao com o Neon 36 vezes so para desistir no fim. Roda com o Python do
      # runner e so a biblioteca padrao: `scanner.calendar` nao importa nada de
      # fora. A guarda do `alerta checar` continua la, por garantia.
      - name: Hoje e pregao?
        id: pregao
        shell: bash
        run: |
          # 0 = pregao, 10 = nao e pregao. Qualquer outro codigo e erro do
          # proprio teste (Python sem base de fusos, import quebrado) e derruba
          # o passo: erro aqui nao pode virar "feriado" e pular a checagem em
          # silencio todo dia.
          set +e
          PYTHONPATH=src python3 -c "import sys; from scanner.calendar import hoje_na_b3, is_trading_day; sys.exit(0 if is_trading_day(hoje_na_b3()) else 10)"
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "aberto=true" >> "$GITHUB_OUTPUT"
          elif [ "$codigo" -eq 10 ]; then
            echo "::notice::Hoje nao e pregao na B3; nada a checar"
          else
            exit "$codigo"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.pregao.outputs.aberto == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        id: deps
        if: steps.pregao.outputs.aberto == 'true'
        run: uv sync --locked --no-dev

      - name: Checar rompimentos
        id: checagem
        if: steps.pregao.outputs.aberto == 'true'
        # Sem alerta ativo o comando sai sem tocar a rede: a consulta aos
        # fornecedores so acontece se houver o que vigiar.
        #
        # `--migrar-antes` faz o papel do passo de migrations que existia aqui.
        # O `daily` tambem migra, mas so roda a noite e de manha: uma migration
        # mergeada no meio do pregao ficaria sem aplicar ate a noite, e todas
        # as passadas ate la bateriam num schema velho. O passo separado
        # resolvia isso com um processo e uma conexao a mais por passada --
        # 5,3s de migrations para 4,7s de checagem, na media de 25 execucoes
        # de 09/10/2026. Agora e uma consulta na conexao que a checagem ja
        # abre, e o Alembic so roda quando ha o que aplicar.
        # --no-sync: sem ele o `uv run` baixa o grupo dev (mypy, ruff, pytest).
        run: uv run --no-sync scanner alerta checar --migrar-antes

      # Sem isto, uma falha aqui e indistinguivel de "nada rompeu": o job fica
      # vermelho numa aba que ninguem abre e o alerta simplesmente nao chega.
      # Mesma lacuna de silencio ambiguo que o daily.yml ja fechou -- so que
      # este roda 36 vezes por dia e e o unico que vigia preco ao vivo.
      - name: Avisar no Telegram se algo falhou
        if: ${{ failure() && env.SCANNER_TELEGRAM_BOT_TOKEN != '' && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          RES_PREGAO: ${{ steps.pregao.outcome }}
          RES_DEPS: ${{ steps.deps.outcome }}
          RES_CHECAGEM: ${{ steps.checagem.outcome }}
        run: |
          onde="passo desconhecido"
          if [ "$RES_PREGAO" = failure ]; then
            onde="conferencia do calendario da B3"
          elif [ "$RES_DEPS" = failure ]; then
            onde="instalacao das dependencias"
          elif [ "$RES_CHECAGEM" = failure ]; then
            onde="migrations ou checagem dos alertas de preco"
          fi

          onde=$(printf '%s' "$onde" | tr -d '<>&')
          texto=$(printf '⚠️ <b>A checagem de rompimentos falhou</b>\nOnde: %s\n\nOs alertas de preco continuam ativos e a proxima passada tenta de novo.\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$onde" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"
