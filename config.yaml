# Configuracao do scanner. Segredos NAO ficam aqui - apenas em variavel de ambiente.

alert:
  metric: z_log             # z_log | z_raw | z_robust
  threshold: 6.0
  windows: [30, 45, 60]
  require_all_windows: false  # false = qualquer janela cruzando dispara
  min_volume_brl: 500000      # piso de sanidade: papel morto nao interessa

ingest:
  # Filtros posicionais do COTAHIST (secao 2 do plano).
  tipreg: "01"
  codbdi: "02"
  tpmerc: "010"
  # Validacao VOLTOT ~= PREMED * QUATOT
  price_check_tolerance: 0.01   # 1% por linha, usado no modo "relative"
  price_check_max_failure: 0.005  # aborta a carga acima de 0,5% das linhas
  # PREMED e truncado a 2 casas: em papel abaixo de R$ 1,00 o erro de quantizacao
  # sozinho passa de 1%, e "relative" fica inalcancavel. "truncation" checa se
  # VOLTOT cai em [PREMED, PREMED+0,01) x QUATOT / FATCOT -- a aritmetica exata.
  price_check_mode: truncation

universe:
  # Filtro de liquidez do universo (F1).
  min_median_volume_brl: 500000
  lookback_sessions: 60
  min_session_coverage: 0.8   # fracao minima de pregoes negociados na janela

retention:
  # O banco hospedado guarda os ultimos N pregoes de barras (secao 5).
  keep_sessions: 400
