name: fundamentos b3

# Disparado por um cron externo (cron-job.org) via workflow_dispatch, nao pelo
# agendador nativo do GitHub -- mesmo motivo do daily.yml e do rompimentos.yml:
# em repositorio publico gratuito ele atrasa e falha demais para ser confiavel.
# Agenda em .github/cron-externo.yml.
#
# Cadastro na B3 (ticker -> empresa) e proventos nao pedem cadencia diaria: a
# empresa nao publica balanco nem provento todo dia, e nada aqui alimenta o
# alerta. O passo Fundamentos do pregao.yml roda so a parte da CVM
# (`--sem-b3`), que e o que P/L, EV/EBITDA e afins precisam e nao depende da
# B3. Esta e a unica passada que consulta a B3 -- e por isso pode ser semanal
# sem a ficha ficar desatualizada: dividend yield 12m atrasado alguns dias nao
# muda a leitura.
#
# Sem rebuild na Vercel aqui de proposito: o pregao roda pelo menos uma vez por
# dia util e ja dispara o rebuild dele, entao o dado que este workflow grava
# aparece no site na proxima passada normal, sem precisar de um gatilho extra.
on:
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reconsultar a B3 inteira, ignorando quem ja foi consultado"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: fundamentos-b3
  cancel-in-progress: false

jobs:
  b3:
    runs-on: ubuntu-latest
    # So a B3 tem timeout largo: sem o passo do pregao competindo pelos mesmos
    # 30 minutos do job, nao ha pressa. Numa passada com tudo vencido de uma vez
    # (as tres consultas para as ~320 empresas), a pior medida ja vista foi
    # 42min54s, em 27/09/2026, dia em que a CVM tambem republicou os zips.
    timeout-minutes: 60

    env:
      FORCAR: ${{ inputs.forcar && '--forcar' || '' }}
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        id: deps
        run: uv sync --locked --no-dev

      - name: Migrations
        id: migrations
        # --no-sync: sem ele o `uv run` ressincroniza com o grupo dev e baixa
        # mypy, ruff e pytest a cada execucao, depois do `--no-dev` acima.
        run: uv run --no-sync alembic upgrade head

      - name: Cadastro e proventos na B3
        id: b3
        # `--forcar` zera os cortes e reconsulta as ~320 empresas nas tres
        # perguntas. E o caminho de uma correcao no parser de proventos chegar
        # ao dado ja gravado: sem ele, empresa consultada ha menos de uma
        # semana nunca e relida, e o numero errado fica. Mesma lacuna que o
        # pregao manual fechou do lado da CVM.
        #
        # Nao use sem motivo: sao ~930 requisicoes na B3 contra as 0 de uma
        # passada em que nada venceu.
        #
        # O `tee` guarda a saida para o aviso dizer o que falhou.
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync scanner fundamentos atualizar $FORCAR 2>&1 | tee /tmp/fundamentos.log

      - name: Avisar no Telegram se algo falhou
        # `cancelled()` junto de `failure()`: com `--forcar` o job passa a poder
        # bater nos 60 minutos, e job cancelado por tempo nao e falha -- sem
        # isto ele morreria calado, que e o mesmo silencio ambiguo que o
        # rompimentos.yml ja fecha.
        if: >-
          ${{ (failure() || cancelled()) && env.SCANNER_TELEGRAM_BOT_TOKEN != ''
          && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          RES_DEPS: ${{ steps.deps.outcome }}
          RES_MIGRATIONS: ${{ steps.migrations.outcome }}
          RES_B3: ${{ steps.b3.outcome }}
        run: |
          onde="passo desconhecido"
          if [ "$RES_B3" = cancelled ]; then
            onde="cancelado no teto de 60 minutos"
          elif [ "$RES_DEPS" = failure ]; then
            onde="instalacao das dependencias"
          elif [ "$RES_MIGRATIONS" = failure ]; then
            onde="migrations"
          elif [ "$RES_B3" = failure ]; then
            onde="carga dos fundamentos"
          fi

          # O que falhou, e nao so que o passo falhou. Em 27/09/2026 este aviso
          # culpou a B3 e disse que nada tinha sido gravado: quem falhou foi um
          # zip da CVM, e a B3 tinha gravado tudo. Sem linha de falha, o passo
          # foi cortado no teto: a ultima linha impressa diz onde estava.
          corpo="Onde: $onde"
          if [ "$RES_B3" = failure ] || [ "$RES_B3" = cancelled ]; then
            detalhe=$(grep -E '^\[fundamentos\] falhou ' /tmp/fundamentos.log 2>/dev/null | sed 's/^\[fundamentos\] //' | head -5 | cut -c1-300 || true)
            if [ -z "$detalhe" ]; then
              ultima=$(grep -E '^\[fundamentos\] ' /tmp/fundamentos.log 2>/dev/null | tail -1 | sed 's/^\[fundamentos\] //' | cut -c1-200 || true)
              if [ -n "$ultima" ]; then
                detalhe="Parou depois de: $ultima"
              else
                detalhe="Parou antes da primeira etapa"
              fi
            fi
            corpo=$(printf '%s\n%s\nO que foi gravado antes da falha fica; o resto é tentado de novo na próxima passada.' "$corpo" "$detalhe")
          fi
          # `cut` corta em byte e pode partir um "Ç" ao meio; o Telegram recusa
          # a mensagem inteira com UTF-8 invalido, e o `iconv -c` tira a sobra.
          corpo=$(printf '%s' "$corpo" | tr -d '<>&' | iconv -c -f UTF-8 -t UTF-8 2>/dev/null || true)

          texto=$(printf '⚠️ <b>Fundamentos da semana com falha</b>\n%s\nO pregão diário não depende disto.\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$corpo" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"
