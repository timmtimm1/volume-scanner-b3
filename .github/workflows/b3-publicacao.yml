name: b3-publicacao

# Mede a que horas a B3 publica o COTAHIST do dia.
#
# Existe para responder uma pergunta, nao para sempre. Em 08/09/2026 o arquivo
# do dia ainda dava 404 as 20:26 BRT, duas horas e meia depois do fechamento --
# foi isso que derrubou a ideia de rodar o scanner na mesma noite. Sabendo a
# distribuicao real de alguns dias, da para decidir com dado em vez de chute
# (e, se for cedo o bastante, ate reconsiderar a janela da noite).
#
# Quando a resposta estiver clara, apague este arquivo.
#
# 20:50 UTC = 17:50 BRT, logo depois do fechamento. Um unico run por dia fica
# batendo na URL a cada 5 minutos ate o arquivo aparecer -- e o job carrega o
# estado, entao nao precisa de banco nem de marcador para nao repetir o aviso.
on:
  schedule:
    - cron: "50 20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: b3-publicacao
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    # 5h de espera + folga. O teto do runner hospedado e 6h.
    timeout-minutes: 330

    env:
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}

    steps:
      - name: Esperar a B3 publicar o arquivo de hoje
        shell: bash
        run: |
          # A data do arquivo e a do pregao em Brasilia, nao a do runner (UTC).
          # Calculada uma vez: passada a meia-noite UTC o pregao continua sendo
          # o mesmo dia aqui.
          dia=$(TZ=America/Sao_Paulo date +%d%m%Y)
          url="https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_D${dia}.ZIP"
          echo "olhando $url"

          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I --max-time 30 "$url" || echo 000)
            agora=$(TZ=America/Sao_Paulo date '+%H:%M')
            echo "$agora BRT -> $code"

            if [ "$code" = "200" ]; then
              if [ -n "$SCANNER_TELEGRAM_BOT_TOKEN" ]; then
                texto=$(printf '📦 <b>A B3 publicou o pregão de hoje</b>\n%s BRT\n\nO scanner processa amanhã às 7h40.' "$agora")
                curl -sS -o /dev/null -X POST \
                  "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
                  -d parse_mode=HTML \
                  -d disable_web_page_preview=true \
                  --data-urlencode "text=$texto"
              fi
              echo "::notice::COTAHIST_D${dia} publicado as ${agora} BRT"
              exit 0
            fi
            sleep 300
          done

          # Silencio de proposito: em feriado o arquivo nunca sai, e um aviso
          # aqui viraria ruido semanal. Quem quiser conferir ve o run.
          echo "::warning::COTAHIST_D${dia} nao apareceu em 5 horas de espera"
