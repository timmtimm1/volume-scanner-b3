name: daily (agendado)

# Disparado por um cron externo (cron-job.org) via workflow_dispatch, não pelo
# agendador nativo do GitHub: em repositório público gratuito ele atrasa e falha
# demais para um job que só tem uma janela por dia. O cron chama este arquivo
# pelo nome: renomear daily.yml quebra a agenda.
#
# Agenda no cron externo (fuso America/Sao_Paulo), dois disparos com o mesmo
# corpo -- a agenda completa esta em .github/cron-externo.yml:
# - 21:30, segunda a sexta: processa o pregao do proprio dia. A B3 costuma
#   publicar por volta das 21h, mas atrasa. Se o arquivo ainda nao saiu, o job
#   termina como ADIADO (sem aviso de falha e sem rebuild na Vercel).
# - 07:40, terca a sabado: reserva. Processa o pregao da vespera. Se a noite ja
#   processou, nada se repete: evento, resumo e carga sao idempotentes.
# Os dois pedem `ultimo`, que e o pregao encerrado mais recente em Sao Paulo.
#
# As etapas vivem em pregao.yml. Para rodar a mao, use pregao-manual.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pregao:
    uses: ./.github/workflows/pregao.yml
    with:
      trade_date: ultimo
    secrets: inherit
