name: pregao

# As etapas do pregao, num lugar so. Nao roda sozinho: quem chama e
# - daily.yml, o disparo agendado pelo cron externo (21:30 e 07:40);
# - pregao-manual.yml, o botao para rodar a mao.
# Os dois executam exatamente isto: rodar a mao testa o mesmo caminho da agenda.
on:
  workflow_call:
    inputs:
      trade_date:
        description: "Pregao a processar (AAAA-MM-DD, 'ultimo' ou 'today')"
        type: string
        required: false
        default: "ultimo"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Um pregao por vez, venha da agenda ou da mao: os dois gravam no mesmo banco.
    # Fica no job, e nao nos workflows que chamam: o mesmo grupo nos dois niveis
    # da mesma execucao trava a execucao esperando por ela mesma.
    concurrency:
      group: pregao
      cancel-in-progress: false
    env:
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
      SCANNER_WEB_BASE_URL: ${{ vars.SCANNER_WEB_BASE_URL }}
      PREGAO: ${{ inputs.trade_date || 'ultimo' }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Barrar Re-run de codigo antigo
        id: guarda
        # O Re-run do GitHub repete a execucao antiga inteira: a data pedida e o
        # commit daquele dia. Em 16/09/2026 um Re-run reprocessou o pregao da
        # vespera num commit temporario e reenviou o resumo no Telegram. Repetir
        # com o main atual vale (ex.: a B3 fora do ar); com codigo velho, nao.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TENTATIVA: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$TENTATIVA" = "1" ]; then
            exit 0
          fi
          if ! atual=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::error title=Re-run sem conferencia::Nao deu para ler o main atual. Rode pelo workflow 'pregao manual' (Run workflow)."
            exit 1
          fi
          if [ "$COMMIT" != "$atual" ]; then
            echo "::error title=Re-run de codigo antigo::Esta e a tentativa $TENTATIVA de uma execucao do commit ${COMMIT:0:7}, com o pregao '$PREGAO'. O main agora esta em ${atual:0:7}. Nada foi feito. Rode de novo pelo workflow 'pregao manual' (Run workflow)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        id: deps
        run: uv sync --locked --no-dev

      - name: Conferir os segredos
        id: segredos
        run: |
          test -n "$SCANNER_DATABASE_URL" || { echo "::error::SCANNER_DATABASE_URL ausente"; exit 1; }
          if [ -z "$SCANNER_TELEGRAM_BOT_TOKEN" ] || [ -z "$SCANNER_TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Configuracao do Telegram incompleta; alertas nao serao enviados"
          fi

      - name: Migrations
        id: migrations
        # --no-sync: sem ele o `uv run` ressincroniza com o grupo dev e baixa
        # mypy, ruff e pytest a cada execucao, depois do `--no-dev` acima.
        run: uv run --no-sync alembic upgrade head

      - name: Pregao do dia
        id: pregao
        shell: bash
        run: |
          set -o pipefail
          set +e
          uv run --no-sync scanner daily --date "$PREGAO" 2>&1 | tee /tmp/daily.log
          codigo=$?
          set -e
          # 75 = o arquivo do pregao de hoje ainda nao saiu da B3. Nao e falha:
          # a passada das 07:40 processa. Marca o passo para pular o rebuild.
          if [ "$codigo" -eq 75 ]; then
            echo "adiado=true" >> "$GITHUB_OUTPUT"
            echo "::notice::B3 ainda nao publicou o pregao de hoje; a passada das 07:40 processa"
            exit 0
          fi
          exit "$codigo"

      - name: Fundamentos
        id: fundamentos
        # Nao pode impedir o alerta nem o rebuild: fundamentos e uma aba a
        # mais na ficha do papel, nao o pipeline principal. O passo vem antes
        # do rebuild -- e nao depois -- porque o site le o banco no build, e
        # uma falha aqui nao pode deixar o build seguinte com dado pela metade.
        continue-on-error: true
        run: uv run --no-sync scanner fundamentos atualizar

      - name: Avisar no Telegram se os fundamentos falharam
        if: ${{ steps.fundamentos.outcome == 'failure' && env.SCANNER_TELEGRAM_BOT_TOKEN != '' && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        run: |
          texto=$(printf '⚠️ <b>Fundamentos não atualizaram</b>\nO pregão de %s foi processado normalmente; a aba Fundamentos segue com os dados anteriores.\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$PREGAO" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"

      - name: Disparar rebuild na Vercel
        id: vercel
        # Adiado nao gravou nada: reconstruir o site so gastaria build.
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' && steps.pregao.outputs.adiado != 'true' }}
        run: |
          curl -sS -f --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null

      - name: Avisar no Telegram se algo falhou
        # Re-run barrado pela guarda nao e falha do pregao: nada rodou, e quem
        # clicou ja esta vendo a mensagem na tela do Actions.
        if: ${{ failure() && steps.guarda.outcome != 'failure' && env.SCANNER_TELEGRAM_BOT_TOKEN != '' && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          RES_DEPS: ${{ steps.deps.outcome }}
          RES_SEGREDOS: ${{ steps.segredos.outcome }}
          RES_MIGRATIONS: ${{ steps.migrations.outcome }}
          RES_PREGAO: ${{ steps.pregao.outcome }}
          RES_VERCEL: ${{ steps.vercel.outcome }}
        run: |
          onde="passo desconhecido"
          if [ "$RES_DEPS" = failure ]; then
            onde="instalacao das dependencias"
          elif [ "$RES_SEGREDOS" = failure ]; then
            onde="conferencia dos segredos"
          elif [ "$RES_MIGRATIONS" = failure ]; then
            onde="migrations"
          elif [ "$RES_PREGAO" = failure ]; then
            ultima=$(grep -E '^\[[0-9]/7\]' /tmp/daily.log 2>/dev/null | tail -1 | cut -c1-52 || true)
            if [ -n "$ultima" ]; then
              onde="pregao, depois de $ultima"
            else
              onde="pregao, antes da primeira etapa"
            fi
          elif [ "$RES_VERCEL" = failure ]; then
            onde="rebuild na Vercel"
          fi

          onde=$(printf '%s' "$onde" | tr -d '<>&')
          texto=$(printf '⚠️ <b>O scanner falhou</b>\nPregão de %s\nOnde: %s\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$PREGAO" "$onde" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"
