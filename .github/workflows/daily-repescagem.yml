name: daily (repescagem)

# As tentativas tardias da noite. Disparado pelo cron externo (cron-job.org) via
# workflow_dispatch, como o daily.yml -- a agenda completa esta em
# .github/cron-externo.yml. O cron chama este arquivo pelo nome: renomear
# daily-repescagem.yml quebra a agenda.
#
# Por que existe: a passada das 21:30 espera o arquivo da B3 por 15 minutos e
# desiste as 21:45. Nos 24 pregoes de 08/09 a 09/10/2026, a data do proprio
# arquivo na B3 mostra que tres sairam entre 21:44 e 21:51 e um as 23:17 -- e
# nesses dias o resumo so chegou as 07:40 da manha seguinte, por minutos.
#
# - 22:15, segunda a sexta: pega o atraso comum, o de minutos.
# - 23:30, segunda a sexta: pega o atraso raro, o de horas. Nao e mais tarde
#   de proposito: com os 15 minutos de espera pelo arquivo, termina as 23:45,
#   ainda dentro do dia em que `ultimo` quer dizer "o pregao de hoje".
#
# Diferenca para o daily.yml: pede `so_se_faltar`. Na maioria das noites as
# 21:30 ja resolveram, e ai esta passada sai na primeira consulta ao banco --
# sem baixar, recalcular, reconstruir o site nem consultar a CVM de novo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pregao:
    uses: ./.github/workflows/pregao.yml
    with:
      trade_date: ultimo
      so_se_faltar: true
    secrets: inherit
