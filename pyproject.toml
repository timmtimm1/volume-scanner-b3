[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volume-scanner-b3"
version = "0.1.0"
description = "Detector de volume financeiro anomalo na B3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
scanner = "scanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Alembic gera os stubs de migration com nomes proprios do framework.
"src/scanner/storage/migrations/*" = ["N999", "E501"]
# `open` e `id` sao nomes de coluna definidos pelo modelo de dados da secao 8.
"src/scanner/storage/models.py" = ["A003"]
# O formato da mensagem da secao 4 do plano usa sinais tipograficos de proposito:
# x de multiplicacao, travessao e seta. Nao sao homoglifos acidentais.
"src/scanner/notify/telegram.py" = ["RUF001", "RUF002", "RUF003"]
# O teste compara a mensagem literal do plano, com os mesmos sinais.
"tests/test_telegram.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# Sem `python_version` fixo: os stubs do numpy usam `type X = ...` e so parseiam
# sob 3.12+. A compatibilidade minima com 3.11 e garantida pelo ruff
# (`target-version = "py311"`), que rejeita sintaxe mais nova no nosso codigo.
strict = true
files = ["src", "tests"]
plugins = []
exclude = ["src/scanner/storage/migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: exige o Postgres local de docker-compose.yml",
]
