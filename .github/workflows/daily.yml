name: daily

# 23:00 UTC = 20:00 em Brasilia, de segunda a sexta.
#
# A secao 5 do plano pede 21:00 UTC, que e 18:00 em Brasilia -- o minuto do
# fechamento. A B3 leva horas depois disso para publicar o arquivo do pregao, e
# medindo em 08/09/2026 as 15:12 o arquivo do dia ainda dava 404. As 18:00 o
# job falharia na carga, todo dia.
#
# 23:00 UTC e o maximo possivel: o Brasil e UTC-3, entao passar de 23:59 UTC
# viraria o dia seguinte no container, e o "--date today" pediria o pregao
# errado -- o de amanha, que ainda nem aconteceu.
# Feriado da B3 nao precisa de excecao aqui: `scanner daily` reconhece o
# calendario e sai sem erro quando nao houve pregao.
on:
  schedule:
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Pregao a processar (AAAA-MM-DD ou 'today')"
        required: false
        default: "today"

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
      SCANNER_WEB_BASE_URL: ${{ vars.SCANNER_WEB_BASE_URL }}
      PREGAO: ${{ inputs.trade_date || 'today' }}
      # No nivel do job porque `secrets` nao e visivel no `if` de um passo;
      # `env` do job e.
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked --no-dev

      - name: Conferir os segredos
        # Falha aqui e explicita; sem isto o erro apareceria como falha de
        # conexao tres passos adiante.
        run: |
          test -n "$SCANNER_DATABASE_URL" || { echo "::error::SCANNER_DATABASE_URL ausente"; exit 1; }
          test -n "$SCANNER_TELEGRAM_BOT_TOKEN" || echo "::warning::sem token do Telegram; os alertas nao serao enviados"

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Pregao do dia
        # Antes eram seis passos: ingest, metrics, db status, scan, resumo e
        # prune. Cada um abria seu proprio Python, conectava no Neon e relia as
        # 130 mil barras para refazer o mesmo calculo -- tres vezes os mesmos
        # z-scores, so para chegar aos mesmos numeros.
        #
        # `scanner daily` faz o calculo uma vez e passa adiante. Alem do tempo,
        # e o que garante que o alerta e o resumo do mesmo pregao falam dos
        # mesmos valores, em vez de dois calculos independentes que se espera
        # que coincidam. O comando imprime uma linha por etapa, entao o log
        # continua dizendo onde parou se algo falhar.
        #
        # Os comandos separados continuam existindo para uso manual.
        run: uv run scanner daily --date "$PREGAO"

      - name: Disparar rebuild na Vercel
        # O site e estatico e os dados mudam uma vez por pregao: o rebuild aqui
        # e o que faz o celular carregar instantaneo, sem API sempre no ar.
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null
