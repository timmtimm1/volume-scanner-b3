name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner -d scanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SCANNER_DATABASE_URL: postgresql+psycopg://scanner:scanner@localhost:5432/scanner

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatacao
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy src/

      - name: Migrations
        run: uv run alembic upgrade head

      - name: Migration bate com os modelos
        run: uv run alembic check

      - name: Testes
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `next build` NAO roda aqui de proposito: ele le o banco em tempo de
      # build, e o Postgres deste job esta vazio. O build de verdade acontece
      # na Vercel, contra o Neon com dado real -- e la que ele tem o que
      # renderizar. Aqui garante-se que o codigo compila e passa no lint.
