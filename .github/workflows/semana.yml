name: semana (resumo semanal)

# Disparado por um cron externo (cron-job.org) via workflow_dispatch, como o
# daily.yml -- a agenda completa esta em .github/cron-externo.yml. O cron chama
# este arquivo pelo nome: renomear semana.yml quebra a agenda.
#
# Dois disparos, sabado, com o mesmo corpo:
# - 08:30: monta o resumo da semana que fechou na sexta e envia no Telegram.
#   Vem 50 minutos depois da reserva do pregao (07:40), que garante o pregao de
#   sexta no banco. Se ele ainda faltar, o job termina como ADIADO, sem falha.
# - 10:30: reserva. Se a das 08:30 ja enviou, nao repete nada (o resumo fica
#   marcado como enviado). Se ela adiou ou falhou, tenta de novo; e se o pregao
#   ainda faltar, avisa no Telegram em vez de ficar calado.
#
# Para reenviar uma edicao ja enviada, ou outra semana, use Run workflow com os
# campos `semana` e `reenviar`. Com `so_juros`, nada e montado nem enviado: so
# o historico de juros do grafico (Tesouro Direto e Selic) e gravado ate aquela
# semana, e o site e reconstruido.
on:
  workflow_dispatch:
    inputs:
      semana:
        description: "Semana a enviar ('ultima' ou uma data AAAA-MM-DD dentro dela)"
        type: string
        required: false
        default: "ultima"
      reenviar:
        description: "Envia de novo um resumo que ja foi enviado"
        type: boolean
        required: false
        default: false
      so_juros:
        description: "So grava o historico de juros do grafico e atualiza o site, sem mandar mensagem"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  semana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Um resumo por vez: as duas passadas do sabado e o botao gravam na mesma linha.
    concurrency:
      group: semana
      cancel-in-progress: false
    env:
      SCANNER_DATABASE_URL: ${{ secrets.SCANNER_DATABASE_URL }}
      SCANNER_TELEGRAM_BOT_TOKEN: ${{ secrets.SCANNER_TELEGRAM_BOT_TOKEN }}
      SCANNER_TELEGRAM_CHAT_ID: ${{ secrets.SCANNER_TELEGRAM_CHAT_ID }}
      SCANNER_WEB_BASE_URL: ${{ vars.SCANNER_WEB_BASE_URL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      SEMANA: ${{ inputs.semana || 'ultima' }}
      REENVIAR: ${{ inputs.reenviar && '--reenviar' || '' }}
    steps:
      - name: Barrar Re-run de codigo antigo
        id: guarda
        # O Re-run do GitHub repete a execucao antiga inteira: a semana pedida e
        # o commit daquele dia. Repetir com o main atual vale (ex.: a B3 fora do
        # ar); com codigo velho, nao.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TENTATIVA: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$TENTATIVA" = "1" ]; then
            exit 0
          fi
          if ! atual=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha); then
            echo "::error title=Re-run sem conferencia::Nao deu para ler o main atual. Rode pelo workflow 'semana' (Run workflow)."
            exit 1
          fi
          if [ "$COMMIT" != "$atual" ]; then
            echo "::error title=Re-run de codigo antigo::Esta e a tentativa $TENTATIVA de uma execucao do commit ${COMMIT:0:7}, com a semana '$SEMANA'. O main agora esta em ${atual:0:7}. Nada foi feito. Rode de novo pelo workflow 'semana' (Run workflow)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        id: deps
        run: uv sync --locked --no-dev

      - name: Conferir os segredos
        id: segredos
        run: |
          test -n "$SCANNER_DATABASE_URL" || { echo "::error::SCANNER_DATABASE_URL ausente"; exit 1; }
          if [ -z "$SCANNER_TELEGRAM_BOT_TOKEN" ] || [ -z "$SCANNER_TELEGRAM_CHAT_ID" ]; then
            echo "::error::Configuracao do Telegram incompleta; o resumo nao teria como sair"
            exit 1
          fi

      - name: Migrations
        id: migrations
        # --no-sync: sem ele o `uv run` ressincroniza com o grupo dev e baixa
        # mypy, ruff e pytest a cada execucao, depois do `--no-dev` acima.
        run: uv run --no-sync alembic upgrade head

      - name: Resumo da semana
        id: resumo
        if: ${{ !inputs.so_juros }}
        shell: bash
        run: |
          # 10h ou mais em Brasilia = a passada de reserva (10:30): se o pregao de
          # sexta ainda faltar, avisa no Telegram em vez de ficar calado.
          hora=$(TZ=America/Sao_Paulo date +%H)
          AVISO=""
          if [ "$((10#$hora))" -ge 10 ]; then
            AVISO="--avisar-se-adiado"
          fi
          set -o pipefail
          set +e
          uv run --no-sync scanner semana enviar --semana "$SEMANA" $REENVIAR $AVISO 2>&1 | tee /tmp/semana.log
          codigo=$?
          set -e
          # 3 = o pregao de sexta ainda nao esta no banco. Nao e falha: a proxima
          # passada monta. Marca o passo para pular o rebuild.
          if [ "$codigo" -eq 3 ]; then
            echo "adiado=true" >> "$GITHUB_OUTPUT"
            echo "::notice::O pregao de sexta ainda nao esta no banco; a proxima passada envia o resumo"
            exit 0
          fi
          if [ "$codigo" -eq 0 ] && grep -q '^\[enviado\]' /tmp/semana.log; then
            echo "enviado=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$codigo"

      - name: So o historico de juros
        id: juros
        if: ${{ inputs.so_juros }}
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync scanner semana juros --semana "$SEMANA" 2>&1 | tee /tmp/semana.log
          if grep -q '^\[gravado\]' /tmp/semana.log; then
            echo "gravado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Disparar rebuild na Vercel
        id: vercel
        # So quando o resumo saiu agora, ou quando o historico de juros foi
        # gravado: a aba do site mostra o que mudou. Adiado, pulado (ja enviado)
        # e falha nao mudam o site.
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' && (steps.resumo.outputs.enviado == 'true' || steps.juros.outputs.gravado == 'true') }}
        run: |
          curl -sS -f --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null

      - name: Avisar no Telegram se algo falhou
        # Re-run barrado pela guarda nao e falha do resumo: nada rodou, e quem
        # clicou ja esta vendo a mensagem na tela do Actions.
        if: ${{ failure() && steps.guarda.outcome != 'failure' && env.SCANNER_TELEGRAM_BOT_TOKEN != '' && env.SCANNER_TELEGRAM_CHAT_ID != '' }}
        shell: bash
        env:
          RES_DEPS: ${{ steps.deps.outcome }}
          RES_SEGREDOS: ${{ steps.segredos.outcome }}
          RES_MIGRATIONS: ${{ steps.migrations.outcome }}
          RES_RESUMO: ${{ steps.resumo.outcome }}
          RES_JUROS: ${{ steps.juros.outcome }}
          RES_VERCEL: ${{ steps.vercel.outcome }}
        run: |
          onde="passo desconhecido"
          if [ "$RES_DEPS" = failure ]; then
            onde="instalacao das dependencias"
          elif [ "$RES_SEGREDOS" = failure ]; then
            onde="conferencia dos segredos"
          elif [ "$RES_MIGRATIONS" = failure ]; then
            onde="migrations"
          elif [ "$RES_RESUMO" = failure ]; then
            ultima=$(grep -E '^\[' /tmp/semana.log 2>/dev/null | tail -1 | cut -c1-80 || true)
            if [ -n "$ultima" ]; then
              onde="resumo, depois de: $ultima"
            else
              onde="resumo, antes da primeira etapa"
            fi
          elif [ "$RES_JUROS" = failure ]; then
            onde="historico de juros"
          elif [ "$RES_VERCEL" = failure ]; then
            onde="rebuild na Vercel"
          fi

          # `cut` corta em byte e pode partir um caractere ao meio; o Telegram
          # recusa UTF-8 invalido, e o `iconv -c` tira a sobra.
          onde=$(printf '%s' "$onde" | tr -d '<>&' | iconv -c -f UTF-8 -t UTF-8 2>/dev/null || true)
          texto=$(printf '⚠️ <b>O resumo da semana falhou</b>\nSemana: %s\nOnde: %s\n\n<a href="%s/%s/actions/runs/%s">ver o que aconteceu</a>' \
            "$SEMANA" "$onde" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          curl -sS --retry 3 --retry-delay 2 --retry-connrefused -o /dev/null -X POST \
            "https://api.telegram.org/bot${SCANNER_TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$SCANNER_TELEGRAM_CHAT_ID" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode "text=$texto"
