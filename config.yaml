# Configuracao do scanner. Segredos NAO ficam aqui - apenas em variavel de ambiente.

alert:
  metric: z_log             # z_log | z_raw | z_robust
  threshold: 6.0
  windows: [30, 45, 60]
  require_all_windows: false  # false = qualquer janela cruzando dispara
  min_volume_brl: 500000      # piso de sanidade: papel morto nao interessa

digest:
  # Resumo diario no Telegram depois do scan: os N papeis que mais fugiram do
  # proprio normal, tenham cruzado o limiar ou nao.
  enabled: true
  top_n: 10
  window: 30      # janela do z usada no ranking

ingest:
  # Filtros posicionais do COTAHIST (secao 2 do plano).
  tipreg: "01"
  codbdi: "02"
  tpmerc: "010"
  # Validacao VOLTOT ~= PREMED * QUATOT
  price_check_tolerance: 0.01   # 1% por linha, usado no modo "relative"
  price_check_max_failure: 0.005  # aborta a carga acima de 0,5% das linhas
  # PREMED e truncado a 2 casas: em papel abaixo de R$ 1,00 o erro de quantizacao
  # sozinho passa de 1%, e "relative" fica inalcancavel. "truncation" checa se
  # VOLTOT cai em [PREMED, PREMED+0,01) x QUATOT / FATCOT -- a aritmetica exata.
  price_check_mode: truncation

universe:
  # Filtro de liquidez do universo (F1).
  min_median_volume_brl: 500000
  lookback_sessions: 60
  min_session_coverage: 0.8   # fracao minima de pregoes negociados na janela

retention:
  # O banco hospedado guarda os ultimos N pregoes de barras (secao 5).
  keep_sessions: 400

fundamentos:
  # Primeiro ano carregado da CVM. 2022 cobre o minigrafico de 8 trimestres e o
  # acumulado de 12 meses dos eventos mais antigos do historico (400 pregoes).
  ano_inicial: 2022
  # Ticker procurado e nao encontrado (um ETF, por exemplo) so e procurado de
  # novo depois deste intervalo, em dias.
  dias_para_rechecar_ticker: 7
  # Cadastro da empresa na B3 e historico de proventos. Na pratica quem manda e
  # o `fundamentos-b3.yml`, que so roda uma vez por semana (domingo) -- este
  # numero e o piso interno, para nao reconsultar tudo se o workflow for
  # disparado duas vezes na mesma semana.
  dias_para_rechecar_empresa: 7
  # Proventos recentes. Mesma logica do campo acima: o `fundamentos-b3.yml` e
  # quem define a cadencia real (semanal); este e o piso dentro dela.
  horas_para_rechecar_proventos: 20

semana:
  # Resumo semanal de mercado (scanner semana montar).
  # Quantas acoes entram em cada lista, altas e quedas.
  acoes_por_lado: 10
  # Cripto: quantas moedas depois de tirar as excluidas, e quantas altas e
  # quedas destacar entre elas (BTC e ETH ficam de fora dos destaques).
  cripto_top: 20
  cripto_destaques: 5
  # Categorias da CoinGecko que nao entram: em 17/10/2026 o top 40 tinha 8
  # stablecoins, tether-gold e figure-heloc (papeis tokenizados).
  cripto_categorias_excluidas: [stablecoins, tokenized-products, tokenized-btc, liquid-staking-tokens]
  # Primeira semana da serie historica de juros (Tesouro Direto e Selic): fixa em
  # 14/10/2016, 10 anos antes da primeira execucao. A serie so cresce dali.
  juros_desde: 2016-10-14
  # Vencimentos do Tesouro americano, como o CSV do Treasury os rotula.
  treasuries: ["3 Mo", "6 Mo", "2 Yr", "5 Yr", "10 Yr", "30 Yr"]
  # Noticias da semana (Google Noticias): quantas historias entram, e as buscas
  # alem da secao Negocios. OR e aspas sao sintaxe de busca do Google.
  noticias_top: 8
  noticias_buscas:
    - Ibovespa
    - Copom OR Selic
    - dólar
    - juros
    - Fed OR "Federal Reserve"
    - inflação
    - economia
    - fiscal OR arcabouço OR "contas públicas"

setups:
  # Aba Setups: candle de reversao (martelo, libelula, engolfo, piercing, estrela
  # da manha) num suporte de 3+ toques, filtrado. Lente separada: nao muda nada
  # no alerta de 6 sigma. Numeros do estudo de 30 anos (scripts/gatilhos_estudo.py).
  enabled: true
  volume_minimo: 1.5      # volume do dia / mediana dos 20 pregoes anteriores
  volume_destaque: 2.5
  espaco_minimo_r: 2.0    # resistencia a pelo menos 2x o risco
  toques_gatilho: 3
  toques_nivel: 2         # nivel existe (e e desenhado) a partir de 2 toques
  prazo_pregoes: 20       # em andamento ate 20 pregoes depois de confirmar
